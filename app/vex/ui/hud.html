<!doctype html><html><head><script>document.write('<script src="brand_cfg.js?'+Date.now()+'"><\/script>')</script><script src="brand.js"></script><meta charset="utf-8"><title>Vex HUD</title><style>
@font-face{font-family:VexMono;src:url(fonts/ShareTechMono-Regular.ttf)}
:root{--c:#5ff3ff;--c2:#19d8ff;--dim:#7fd7e8}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 70% 0%,#04202c 0%,#01030a 70%);overflow:hidden;font-family:VexMono,monospace;color:#bff8ff;user-select:none}
body{border:1px solid rgba(95,243,255,.25);box-sizing:border-box}
.p{position:relative;margin:12px 14px;padding:12px 16px;background:linear-gradient(160deg,rgba(2,14,24,.62),rgba(1,5,12,.72));border:1px solid rgba(95,243,255,.2);
 clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));overflow:hidden}
.p::before{content:attr(data-t);display:block;font-size:10px;letter-spacing:.35em;color:#5ff3ff99;margin-bottom:8px}
#t{font-size:46px;font-weight:300;letter-spacing:.06em;text-shadow:0 0 14px rgba(34,229,255,.35)}#d{font-size:12px;letter-spacing:.3em;color:var(--dim)}#clk{text-align:right}
.bar{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;margin:6px 0}.bar span{width:44px;color:var(--dim)}
.bar i{flex:1;height:3px;background:#0b2a36;position:relative}.bar i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c2),#bff8ff);box-shadow:0 0 8px var(--c2)}.bar em{width:40px;text-align:right;font-style:normal}
.list div{padding:3px 0;border-bottom:1px solid rgba(95,243,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#a9d8e4;font-size:12px}
#core{font-size:12px;letter-spacing:.25em}#core b{color:#fff;font-weight:400}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;margin-right:8px}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(120,240,255,.025) 0 1px,transparent 1px 3px)}
.term-only{display:none}
/* ---- terminal (dense, full monitor) ---- */
body.term{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto;gap:0;padding:6px}
body.term .term-only{display:block}
body.term #core{grid-column:1/3;grid-row:1}body.term #clk{grid-column:3;grid-row:1}
body.term #todo{grid-column:1;grid-row:2}body.term #act{grid-column:1;grid-row:3}
body.term #logp{grid-column:2;grid-row:2/4}body.term #st{grid-column:3;grid-row:2}body.term #ro{grid-column:3;grid-row:3}
body.term #foot{grid-column:1/4;grid-row:4}
body.term.hasmsg #logp{display:none}body.term.hasmsg #msgp{grid-column:2;grid-row:2/4}#msgp{border-color:rgba(255,209,102,.35)}
#log{font-size:12px;line-height:1.5;color:#9fe9f5;white-space:pre;overflow:hidden;height:calc(100% - 22px);display:flex;flex-direction:column;justify-content:flex-end}
#log span{color:#5ff3ff88}#log .w{color:#ffd166}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ro div{border:1px solid rgba(95,243,255,.18);padding:10px;font-size:10px;letter-spacing:.25em;color:var(--dim)}
.ro b{display:block;font-size:26px;letter-spacing:.04em;color:#e6fdff;font-weight:300;margin-top:6px;text-shadow:0 0 10px rgba(34,229,255,.35)}
#foot{font-size:10px;letter-spacing:.4em;color:#5ff3ff77;padding:6px 18px;display:flex;justify-content:space-between}
body.term #t{font-size:64px}
</style></head><body>
<div class="p" id="core" data-t="VEX // REMOTE HUD"><span class="dot"></span><b id="nm">VEX</b> <span id="stt">ONLINE</span><span class="term-only" id="sub" style="margin-top:8px;color:#7fd7e8;font-size:11px"></span></div>
<div class="p" id="msgp" data-t="VEX // MESSAGE" style="display:none"><div id="mt" style="font-size:15px;color:#fff;letter-spacing:.08em;margin-bottom:8px"></div><div id="mx" style="font-size:13px;line-height:1.55;color:#bfefff;white-space:pre-wrap;max-height:60vh;overflow:hidden"></div></div>
<div class="p" id="clk" data-t="LOCAL TIME"><div id="t">--:--</div><div id="d"></div></div>
<div class="p term-only" id="todo" data-t="TASKS // REMINDERS"><div class="list" id="todos"><div>No open tasks.</div></div></div>
<div class="p term-only" id="logp" data-t="LIVE LOG // VEX CORE"><div id="log"></div></div>
<div class="p" id="st" data-t="SYSTEM"><div id="bars"></div></div>
<div class="p term-only" id="ro" data-t="READOUTS"><div class="ro" id="ros"></div></div>
<div class="p" id="act" data-t="ACTIVITY"><div class="list" id="feed"><div>Standing by.</div></div></div>
<div class="term-only" id="foot"><span>VEX HOLO INTERFACE // SECONDARY DISPLAY</span><span id="fv"></span></div>
<div id="scan"></div>
<script>
const $=q=>document.querySelector(q),E=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
window.hudStyle=s=>document.body.classList.toggle("term",s=="terminal");
function tick(){const n=new Date();$("#t").textContent=n.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});$("#d").textContent=n.toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"}).toUpperCase();}
setInterval(tick,1000);tick();
function bar(k,v,txt){v=Math.max(0,Math.min(100,+v||0));return `<div class="bar"><span>${k}</span><i><b style="width:${v}%"></b></i><em>${txt||Math.round(v)+"%"}</em></div>`;}
const up=s=>{s=+s||0;return `${String(s/3600|0).padStart(2,"0")}:${String(s/60%60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;};
async function load(){const a=window.pywebview&&pywebview.api;if(!a||!a.hud_data)return setTimeout(load,800);
 try{const d=await a.hud_data(),s=d.stats||{};hudStyle(d.style);$("#nm").textContent=(d.name||"VEX").toUpperCase();$("#stt").textContent=String(d.state||"online").toUpperCase();
  $("#bars").innerHTML=bar("CPU",s.cpu)+bar("RAM",s.ram)+(s.gpu!=null?bar("GPU",s.gpu):"")+(s.disk_pct!=null?bar("DISK",s.disk_pct):"");
  const f=(d.feed||[]).slice(0,document.body.classList.contains("term")?14:7);if(f.length)$("#feed").innerHTML=f.map(x=>`<div>› ${E((x.kind||"").toUpperCase())} ${E(x.text||x)}</div>`).join("");
  const td=[...(d.todos||[]).map(t=>"▢ "+(t.text||t)),...(d.reminders||[]).map(r=>"◷ "+(r.text||"")+(r.when?" · "+r.when:""))];$("#todos").innerHTML=td.length?td.map(x=>`<div>${E(x)}</div>`).join(""):"<div>No open tasks.</div>";
  $("#log").innerHTML=(d.log||[]).map(l=>{const m=l.match(/^(\S+) (.*)$/);return m?`<div class="${/WARNING/.test(l)?"w":""}"><span>${E(m[1])}</span> ${E(m[2].replace(/^(root|vex\.\w+) (INFO|WARNING) /,""))}</div>`:`<div>${E(l)}</div>`;}).join("");
  $("#ros").innerHTML=[["UPTIME",up(d.uptime)],["NET ↓",(s.net_down!=null?s.net_down:"--")],["NET ↑",(s.net_up!=null?s.net_up:"--")],["RAM",(s.ram_total||"--")+" GB"],["DISK FREE",(s.disk_free||"--")+" GB"],["DISPLAYS",(d.monitors||[]).length]].map(([k,v])=>`<div>${k}<b>${E(v)}</b></div>`).join("");
  const M=d.msg;document.body.classList.toggle("hasmsg",!!M);$("#msgp").style.display=M?"block":"none";if(M){$("#mt").textContent=M.title||"";$("#mx").textContent=M.text||"";}
  $("#sub").textContent="BUILD "+(d.version||"")+"  ·  THEME "+String((d.look||{}).preset||"ARC BLUE").toUpperCase();$("#fv").textContent="v"+(d.version||"");
  const L=d.look||{};const fl=[];if(L.hue)fl.push(`hue-rotate(${L.hue}deg)`);if(L.sat!=null&&L.sat!=1)fl.push(`saturate(${L.sat})`);if(L.dark)fl.push(`brightness(${1-L.dark})`);document.documentElement.style.filter=fl.join(" ");
 }catch(e){}setTimeout(load,1000);}
addEventListener("pywebviewready",load);setTimeout(load,1500);
</script></body></html>
