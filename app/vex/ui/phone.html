<!doctype html>
<html lang="en"><head><script>document.write('<script src="brand_cfg.js?'+Date.now()+'"><\/script>')</script><script src="brand.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vex">
<meta name="theme-color" content="#0a0a10"><meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a10'/%3E%3Ccircle cx='90' cy='90' r='54' fill='%238b5cf6'/%3E%3Ctext x='90' y='110' font-size='60' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<title>Vex</title>
<style>
:root{--bg:#0a0a10;--panel:#14141f;--line:#26243b;--text:#ece9ff;--dim:#8f8aa8;--p:#8b5cf6;--p2:#a855f7;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;align-items:center;gap:10px;padding:6px 4px 12px}
.logo{width:34px;height:34px;border-radius:11px;background:radial-gradient(circle at 35% 30%,#d8b4fe,#8b5cf6 55%,#4c1d95);box-shadow:0 0 18px #8b5cf688;display:grid;place-items:center;font-weight:800;color:#fff}
h1{font-size:18px;margin:0}#st{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.g{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.r{background:var(--bad)}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.you{align-self:flex-end;background:#26233b;border-bottom-right-radius:5px}
.vex{align-self:flex-start;background:linear-gradient(135deg,#8b5cf633,#a855f722);border:1px solid #8b5cf655;border-bottom-left-radius:5px}
.ask{display:flex;gap:10px;margin-top:8px}.ask button{flex:1}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;color:#fff;background:#232136}
.p{background:linear-gradient(135deg,#8b5cf6,#a855f7);font-weight:600}.no{background:#2c2a40}
.bar{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px}
.bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:10px}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;font-size:14px;padding:10px}
#setup{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
#setup input{width:100%;margin:6px 0 10px;background:#0f0f18;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:15px;font-family:ui-monospace,Menlo,monospace}
.hint{color:var(--dim);font-size:12.5px;text-align:center;margin-top:8px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#0f0f18;padding:2px 6px;border-radius:6px;word-break:break-all}
.md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}.md h3,.md h4,.md h5,.md h6{margin:10px 0 6px;color:#c084fc}.md ul,.md ol{margin:4px 0 8px;padding-left:22px}.md li{margin:2px 0}
.md code{background:#1f1c33;padding:1px 6px;border-radius:6px;font-family:Consolas,monospace;font-size:.92em;color:#e9d5ff}
.md .code{background:#0b0a14;border:1px solid #26243b;border-radius:12px;margin:8px 0;overflow:hidden}.md .codeh{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#15132a;font-size:11px;color:#8f8aa8}
.md pre{margin:0;padding:12px;overflow-x:auto}.md pre code{background:none;padding:0;color:#e5e1ff;font-size:12.5px;line-height:1.5}
.copy{background:#24203d;border:1px solid #26243b;color:#ece9ff;border-radius:7px;font-size:11px;padding:3px 9px;cursor:pointer}.copy:hover{border-color:#8b5cf6}
.md table{border-collapse:collapse;margin:8px 0;font-size:13px}.md th,.md td{border:1px solid #26243b;padding:5px 9px}.md th{background:#1a1730}
.md blockquote{border-left:3px solid #8b5cf6;margin:6px 0;padding:2px 10px;color:#cfcae6}.md a{color:#c084fc}
.vex.md{white-space:normal}.md pre code{font-size:12px}
</style></head><body>
<header><div class="logo">V</div><h1>Vex</h1><div id="st"><span class="dot" id="dot"></span><span id="stt">checking…</span></div></header>
<div id="setup">
  <b>Pair with Vex</b><br>Scan the QR code in Vex → Settings → Phone with your camera, or paste the pairing key here:
  <input id="keyIn" placeholder="xxxxx-xxxxx-xxxxx-xxxxx" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="p" id="saveKey">Save key</button>
</div>
<div id="log"></div>
<div class="bar"><input id="txt" placeholder="Ask anything or give a command…" enterkeyhint="send" autocomplete="off"><button class="p" id="go">Send</button></div>
<div class="row"><button id="newc">New chat</button><button id="stop">Vex stop</button><button id="speakT">Speak replies: on</button><button id="info">Shortcut info</button></div>
<div class="hint">Works on your home Wi-Fi only. Risky stuff always asks Yes / No first.</div>
<script>
function esc(t){return String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mdInline(s){s=esc(s);
 s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
 s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
 s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank">$2</a>');return s;}
function md(src){const lines=String(src||"").replace(/\r/g,"").split("\n");let o="",i=0;
 while(i<lines.length){let l=lines[i];
  let f=l.match(/^\s*```(\w*)/);if(f){let code=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))code.push(lines[i++]);i++;
   o+=`<div class="code"><div class="codeh"><span>${esc(f[1]||"code")}</span><button class="copy" onclick="copyCode(this)">Copy</button></div><pre><code>${esc(code.join("\n"))}</code></pre></div>`;continue;}
  let h=l.match(/^(#{1,4})\s+(.*)/);if(h){o+=`<h${h[1].length+2}>${mdInline(h[2])}</h${h[1].length+2}>`;i++;continue;}
  if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){const row=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>mdInline(c.trim()));
   let t="<table><tr>"+row(l).map(c=>"<th>"+c+"</th>").join("")+"</tr>";i+=2;while(i<lines.length&&/^\s*\|/.test(lines[i]))t+="<tr>"+row(lines[i++]).map(c=>"<td>"+c+"</td>").join("")+"</tr>";o+=t+"</table>";continue;}
  if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<lines.length&&/^\s*([-*•]|\d+[.)])\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/,""));
   o+=(ol?"<ol>":"<ul>")+it.map(x=>"<li>"+mdInline(x)+"</li>").join("")+(ol?"</ol>":"</ul>");continue;}
  if(/^\s*>/.test(l)){o+="<blockquote>"+mdInline(l.replace(/^\s*>\s?/,""))+"</blockquote>";i++;continue;}
  if(!l.trim()){i++;continue;}
  let p=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(```|#{1,4}\s|[-*•]\s|\d+[.)]\s|>|\|)/.test(lines[i]))p.push(lines[i++]);
  if(!p.length)p.push(lines[i++]);o+="<p>"+p.map(mdInline).join("<br>")+"</p>";}
 return o;}
function copyCode(b){const t=b.closest(".code").querySelector("code").innerText;navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1500);});}
function copyMsg(b){const t=b.closest(".cm").dataset.raw||"";navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1500);});}

const $=s=>document.querySelector(s);
let KEY=localStorage.getItem("vexKey")||"";
const h=new URLSearchParams(location.hash.slice(1));
if(h.get("k")){KEY=h.get("k");localStorage.setItem("vexKey",KEY);}
history.replaceState(null,"",location.pathname);  // key never stays in the address bar / history
let SPEAK=localStorage.getItem("vexSpeak")!=="0";
let CHAT=localStorage.getItem("vexChat")||"";
function add(who,text){const d=document.createElement("div");d.className="m "+who;if(who=="vex"){d.classList.add("md");d.innerHTML=md(text);}else d.textContent=text;$("#log").appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"});return d;}
function say(t){if(!SPEAK||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
function unlockSpeech(){try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
async function call(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:Object.assign({"X-Vex-Key":KEY},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined,cache:"no-store"});
  let j={};try{j=await r.json();}catch(e){}
  if(r.status==401){$("#setup").style.display="block";}
  return j;}
function status(ok,t){$("#dot").className="dot "+(ok?"g":"r");$("#stt").textContent=t;}
async function ping(){if(!KEY){status(false,"not paired");$("#setup").style.display="block";return;}
  try{const j=await call("/ping");if(j.ok){status(true,"connected");$("#setup").style.display="none";}else status(false,j.reply||"not connected");}
  catch(e){status(false,"can't reach PC");}}
function plain(t){return String(t||"").replace(/```[\s\S]*?```/g," (code on screen) ").replace(/[*_#`>|]/g,"").replace(/https?:\/\/\S+/g,"");}
function show(j){if(j.chat_id){CHAT=j.chat_id;localStorage.setItem("vexChat",CHAT);}const d=add("vex",(j.reply||"…")+(j.detail?"\n\n"+j.detail:""));say(plain(j.reply||""));
  if(j.needs_confirm&&j.confirm_id){const a=document.createElement("div");a.className="ask";
    const y=document.createElement("button");y.className="p";y.textContent="Yes";const n=document.createElement("button");n.className="no";n.textContent="No";
    const done=async yes=>{unlockSpeech();a.remove();add("you",yes?"Yes":"No");try{show(await call(j.chat_id?"/chat_confirm":"/confirm",{id:j.confirm_id,yes:yes}));}catch(e){add("vex","Couldn't reach your PC.");}};
    y.onclick=()=>done(true);n.onclick=()=>done(false);a.append(y,n);d.appendChild(a);d.scrollIntoView({block:"end"});}}
async function send(text){text=(text||"").trim();if(!text)return;unlockSpeech();add("you",text);$("#txt").value="";
  const th=add("vex","…thinking");try{const j=await call("/chat",{text,chat_id:CHAT});th.remove();show(j);}catch(e){th.remove();add("vex","Couldn't reach your PC. Is it on and are you on home Wi-Fi?");status(false,"can't reach PC");}}
$("#go").onclick=()=>send($("#txt").value);
$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send($("#txt").value);}});
$("#newc").onclick=()=>{CHAT="";localStorage.removeItem("vexChat");$("#log").innerHTML="";add("vex","New chat. What's up?");};
$("#stop").onclick=()=>send("vex stop");
$("#speakT").textContent="Speak replies: "+(SPEAK?"on":"off");
$("#speakT").onclick=()=>{SPEAK=!SPEAK;localStorage.setItem("vexSpeak",SPEAK?"1":"0");$("#speakT").textContent="Speak replies: "+(SPEAK?"on":"off");};
$("#saveKey").onclick=()=>{KEY=$("#keyIn").value.trim().toLowerCase();localStorage.setItem("vexKey",KEY);ping();};
$("#info").onclick=()=>{const d=add("vex","");d.innerHTML=`For the Vex Shortcut use:<br>URL <code>${location.origin}/command</code><br>Header <code>X-Vex-Key</code><br>Key <code id="kk"></code><br><button class="p" id="cpk" style="margin-top:8px">Copy key</button>`;
  d.querySelector("#kk").textContent=KEY||"(not paired)";d.querySelector("#cpk").onclick=async e=>{try{await navigator.clipboard.writeText(KEY);e.target.textContent="Copied";}catch(x){const r=document.createRange();r.selectNode(d.querySelector("#kk"));getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="Selected – tap Copy";}};};
ping();setInterval(ping,30000);
</script></body></html>
