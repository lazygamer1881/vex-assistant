<!doctype html><html><head><script>document.write('<script src="brand_cfg.js?'+Date.now()+'"><\/script>')</script><script src="brand.js"></script><meta charset="utf-8"><title>Vex Mini</title><link rel="stylesheet" href="tokens.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01060c;cursor:pointer;user-select:none}canvas{width:100%;height:100%;display:block}
#t{position:fixed;left:0;right:0;bottom:6px;text-align:center;font:9px var(--vx-f-mono);letter-spacing:.3em;color:var(--vx-dim)}</style></head>
<body data-mode="blue"><canvas id="c" width="320" height="320"></canvas><div id="t">CLICK TO TALK</div>
<script>
// Vex 4.0 floating mini-orb (opt-in by voice/tray). Click = push to talk, double-click = back to full size. No sounds.
const c=document.getElementById('c'),g=c.getContext('2d');let T=0,amp=0;
function col(){return (getComputedStyle(document.body).getPropertyValue('--vx-a')||'#5fd4ff').trim();}
function draw(){T+=.016;g.clearRect(0,0,320,320);const a=col();g.save();g.translate(160,150);
 for(let i=0;i<3;i++){g.beginPath();g.strokeStyle=a;g.globalAlpha=.25+.2*i;g.lineWidth=1+i*.5;g.setLineDash(i==1?[4,6]:[]);g.arc(0,0,70+i*16,T*(i%2?-.6:.4),T*(i%2?-.6:.4)+Math.PI*1.6);g.stroke();}
 g.setLineDash([]);const r=46+amp*20+Math.sin(T*2)*2,gr=g.createRadialGradient(0,0,2,0,0,r);gr.addColorStop(0,'#fff');gr.addColorStop(.35,a);gr.addColorStop(1,'rgba(0,0,0,0)');
 g.globalAlpha=1;g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
 for(let i=0;i<80;i++){const th=i*2.4+T*.5,rr=30+((i*37)%30)+amp*14;g.fillStyle=a;g.globalAlpha=.6;g.fillRect(Math.cos(th)*rr,Math.sin(th)*rr*.9,1.6,1.6);}
 g.restore();amp*=.9;requestAnimationFrame(draw);}
draw();
let clk=0;document.body.onclick=()=>{clearTimeout(clk);clk=setTimeout(()=>{try{pywebview.api.v40_ptt()}catch(e){}},260);};
document.body.ondblclick=()=>{clearTimeout(clk);try{pywebview.api.v40_mini(false)}catch(e){}};
async function poll(){try{const d=await pywebview.api.jhud();document.body.dataset.mode=d.mode||'blue';}catch(e){}}
addEventListener('pywebviewready',()=>{poll();setInterval(poll,4000);});
</script></body></html>
